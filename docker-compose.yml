services:
  mysql:
    container_name: recruitment-mysql
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-recruitment}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"

  logic:
    container_name: recruitment-logic
    build:
      context: .
      dockerfile: logic-grpc-service/Dockerfile
    environment:
      LOGIC_GRPC_ADDR: ":9002"
      MYSQL_DSN: "root:${MYSQL_ROOT_PASSWORD:-password}@tcp(mysql:3306)/${MYSQL_DATABASE:-recruitment}?charset=utf8mb4&parseTime=True&loc=Local"
      MYSQL_MAX_OPEN_CONNS: ${MYSQL_MAX_OPEN_CONNS:-25}
      MYSQL_MAX_IDLE_CONNS: ${MYSQL_MAX_IDLE_CONNS:-10}
      MYSQL_CONN_MAX_LIFETIME_SECONDS: ${MYSQL_CONN_MAX_LIFETIME_SECONDS:-1800}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-45}
      AI_SHOW_TOOL_RESULTS: ${AI_SHOW_TOOL_RESULTS:-false}
      RAG_ENABLED: ${RAG_ENABLED:-false}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      RAG_EMBEDDING_ENDPOINT: ${RAG_EMBEDDING_ENDPOINT:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-v3}
      RAG_EMBEDDING_DIMENSION: ${RAG_EMBEDDING_DIMENSION:-1024}
      RAG_EMBEDDING_TIMEOUT_SECONDS: ${RAG_EMBEDDING_TIMEOUT_SECONDS:-15}
      MILVUS_ADDRESS: standalone:19530
      MILVUS_USERNAME: ${MILVUS_USERNAME:-}
      MILVUS_PASSWORD: ${MILVUS_PASSWORD:-}
      MILVUS_DB_NAME: ${MILVUS_DB_NAME:-}
      MILVUS_COLLECTION: ${RAG_MILVUS_COLLECTION:-resume_experience_chunk_vectors}
      MILVUS_VECTOR_FIELD: ${MILVUS_VECTOR_FIELD:-dense_vector}
      MILVUS_SPARSE_VECTOR_FIELD: ${MILVUS_SPARSE_VECTOR_FIELD:-sparse_vector}
      MILVUS_TEXT_FIELD: ${MILVUS_TEXT_FIELD:-search_text}
      MILVUS_METRIC_TYPE: ${MILVUS_METRIC_TYPE:-COSINE}
      MILVUS_OUTPUT_FIELDS: ${RAG_MILVUS_OUTPUT_FIELDS:-chunk_id,hr_id,job_id,created_at}
      RAG_TOP_K: ${RAG_TOP_K:-8}
    ports:
      - "9002:9002"
    depends_on:
      mysql:
        condition: service_healthy
      standalone:
        condition: service_healthy
    restart: unless-stopped

  web:
    container_name: recruitment-web
    build:
      context: .
      dockerfile: web-gin-service/Dockerfile
    environment:
      WEB_HTTP_ADDR: ":8080"
      LOGIC_GRPC_ADDR: logic:9002
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-72}
      UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/uploads:/app/uploads
    depends_on:
      - logic
    restart: unless-stopped

  frontend:
    container_name: recruitment-frontend
    build:
      context: recruitment-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - web
    restart: unless-stopped

networks:
  default:
    name: recruitment
